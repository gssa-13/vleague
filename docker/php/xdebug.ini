[xdebug]
; Xdebug 3.x configuration for Laravel 12

; (NO zend_extension aquí, ya se activa con docker-php-ext-enable)

; Set Xdebug mode (debug for step debugging, develop for helpers)
xdebug.mode=debug,develop

; IDE key
xdebug.idekey=PHPSTORM

; Client configuration
xdebug.client_host=host.docker.internal
xdebug.client_port=9003

; Start debugging automatically
xdebug.start_with_request=yes

; Allow automatic client detection
xdebug.discover_client_host=true

; Log file for debugging connection issues
xdebug.log=/var/log/xdebug.log
xdebug.log_level=7

; Show local variables in stack traces
xdebug.show_local_vars=on

; Maximum nesting level for deep Laravel objects
xdebug.max_nesting_level=512

; Collect variable assignments
xdebug.collect_assignments=on
